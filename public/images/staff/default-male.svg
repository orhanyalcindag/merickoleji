<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <clipPath id="maleBadgeClip">
      <circle cx="200" cy="200" r="172" />
    </clipPath>
  </defs>

  <!-- Base White Circle -->
  <circle cx="200" cy="200" r="185" fill="#FFFFFF" />

  <!-- Avatar Elements clipped inside circle -->
  <g clip-path="url(#maleBadgeClip)">
    <!-- Shoulders and Teal Shirt -->
    <path d="M 75 400 C 80 305, 120 258, 200 258 C 280 258, 320 305, 325 400 Z" fill="#3CACA2" />

    <!-- Neck Base -->
    <path d="M 172 258 Q 200 285 228 258 L 225 192 L 175 192 Z" fill="#E8C5A9" />

    <!-- Crew Neckline Trim -->
    <path d="M 170 258 Q 200 286 230 258" stroke="#31988F" stroke-width="2.5" fill="none" />

    <!-- Neck Shadow under chin -->
    <path d="M 174 195 Q 200 220 226 195 Q 200 230 174 195 Z" fill="#DEB095" />

    <!-- Ears -->
    <circle cx="145" cy="165" r="11" fill="#E8C5A9" />
    <circle cx="255" cy="165" r="11" fill="#E8C5A9" />

    <!-- Face Base (Faceless Minimalist Silhouette) -->
    <path d="M 152 142 C 150 186, 166 214, 200 214 C 234 214, 250 186, 248 142 C 248 100, 235 84, 200 84 C 165 84, 152 100, 152 142 Z" fill="#E8C5A9" />

    <!-- Male Hair (Modern neat short haircut in flat soft black) -->
    <!-- Back Volume / Sides -->
    <path d="M 144 165 C 142 120, 160 80, 200 68 C 242 70, 258 120, 256 165 C 253 150, 248 135, 244 125 C 238 105, 222 92, 198 90 C 172 90, 158 105, 154 125 C 150 135, 147 150, 144 165 Z" fill="#2B282E" />
    <!-- Hair Top & Side-part Volume -->
    <path d="M 142 150 C 140 102, 165 65, 205 64 C 235 64, 258 84, 258 132 C 252 120, 244 102, 225 96 C 200 90, 168 96, 155 125 C 148 135, 145 142, 142 150 Z" fill="#2B282E" />
    <!-- Sideburns -->
    <rect x="144" y="142" width="6" height="15" rx="2" fill="#2B282E" />
    <rect x="250" y="142" width="6" height="15" rx="2" fill="#2B282E" />
  </g>

  <!-- Inner Teal Ring -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="#3CACA2" stroke-width="4" />

  <!-- Outer Coral Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#DA5547" stroke-width="12" />
</svg>