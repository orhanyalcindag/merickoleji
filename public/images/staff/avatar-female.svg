<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <clipPath id="femaleBadgeClip">
      <circle cx="200" cy="200" r="172" />
    </clipPath>
  </defs>

  <!-- Base White Circle -->
  <circle cx="200" cy="200" r="185" fill="#FFFFFF" />

  <!-- Avatar Elements clipped inside circle -->
  <g clip-path="url(#femaleBadgeClip)">
    <!-- Back Hair Volume (behind neck and shoulders) -->
    <path d="M 132 150 C 120 220, 124 285, 148 330 C 158 290, 166 250, 164 200 Z" fill="#2B282E" />
    <path d="M 268 150 C 280 220, 276 285, 252 330 C 242 290, 234 250, 236 200 Z" fill="#2B282E" />

    <!-- Shoulders and Teal Shirt -->
    <path d="M 75 400 C 80 305, 120 260, 200 260 C 280 260, 320 305, 325 400 Z" fill="#3CACA2" />

    <!-- Neck and Chest Base -->
    <path d="M 166 260 Q 200 292 234 260 L 230 195 L 170 195 Z" fill="#E8C5A9" />

    <!-- Scoop Neckline Trim -->
    <path d="M 164 260 Q 200 294 236 260" stroke="#31988F" stroke-width="2.5" fill="none" />

    <!-- Neck Shadow under chin -->
    <path d="M 175 198 Q 200 222 225 198 Q 200 232 175 198 Z" fill="#DEB095" />

    <!-- Face Base (Faceless Minimalist Silhouette) -->
    <path d="M 152 145 C 150 188, 164 214, 200 214 C 236 214, 250 188, 248 145 C 248 100, 234 85, 200 85 C 166 85, 152 100, 152 145 Z" fill="#E8C5A9" />

    <!-- Front Hair (Shoulder-length, parted down middle) -->
    <path d="M 200 48 C 152 48, 128 88, 128 160 C 128 210, 140 275, 160 318 C 166 314, 172 292, 168 260 C 164 220, 156 178, 160 148 C 164 116, 178 94, 200 86 C 222 94, 236 116, 240 148 C 244 178, 236 220, 232 260 C 228 292, 234 314, 240 318 C 260 275, 272 210, 272 160 C 272 88, 248 48, 200 48 Z" fill="#2B282E" />
  </g>

  <!-- Inner Teal Ring -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="#3CACA2" stroke-width="4" />

  <!-- Outer Coral Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#DA5547" stroke-width="12" />
</svg>