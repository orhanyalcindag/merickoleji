<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="suitGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2547" />
      <stop offset="100%" stop-color="#0A1930" />
    </linearGradient>
    <linearGradient id="innerBlouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="skinGradFemale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="hairGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadowF" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgFemale)" />

  <!-- Subtle Emblem Ring -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="200" cy="200" r="160" fill="#FFFFFF" opacity="0.5" />

  <!-- Hair Back Layer (Flowing behind shoulders) -->
  <path d="M 130 170 C 120 230, 125 285, 145 320 C 155 290, 160 250, 155 200 Z" fill="url(#hairGradFemale)" />
  <path d="M 270 170 C 280 230, 275 285, 255 320 C 245 290, 240 250, 245 200 Z" fill="url(#hairGradFemale)" />

  <!-- Body / Blazer Outfit -->
  <g filter="url(#shadowF)">
    <!-- Shoulders & Blazer -->
    <path d="M 95 400 C 105 325, 138 285, 200 285 C 262 285, 295 325, 305 400 Z" fill="url(#suitGradFemale)" />

    <!-- Inner Blouse / Top (Gold/Amber) -->
    <path d="M 175 285 Q 200 330 225 285 L 220 370 Q 200 380 180 370 Z" fill="url(#innerBlouseGrad)" />
    <!-- White Trim Collar -->
    <path d="M 180 285 Q 200 315 220 285" stroke="#FFFFFF" stroke-width="3" fill="none" />

    <!-- Elegant Necklace/Pendant -->
    <path d="M 185 275 Q 200 300 215 275" stroke="#FDE68A" stroke-width="2" fill="none" />
    <circle cx="200" cy="296" r="3.5" fill="#F59E0B" stroke="#B45309" stroke-width="1" />

    <!-- Blazer Lapels -->
    <path d="M 130 400 L 175 285 L 188 340 L 150 400 Z" fill="#1E3A8A" opacity="0.25" />
    <path d="M 270 400 L 225 285 L 212 340 L 250 400 Z" fill="#0A1930" opacity="0.35" />
  </g>

  <!-- Neck -->
  <rect x="185" y="225" width="30" height="55" rx="5" fill="#F59E0B" opacity="0.3" />
  <rect x="187" y="220" width="26" height="50" rx="4" fill="url(#skinGradFemale)" />

  <!-- Head -->
  <g filter="url(#shadowF)">
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="48" ry="56" fill="url(#skinGradFemale)" />

    <!-- Ears -->
    <circle cx="151" cy="184" r="9" fill="url(#skinGradFemale)" />
    <circle cx="249" cy="184" r="9" fill="url(#skinGradFemale)" />
    <!-- Pearl Earrings -->
    <circle cx="150" cy="189" r="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="250" cy="189" r="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

    <!-- Elegant Hair (Voluminous bob / waves) -->
    <path d="M 142 180 C 138 128, 162 104, 200 104 C 238 104, 262 128, 258 180 C 265 210, 258 245, 248 255 C 242 225, 246 185, 242 165 C 230 135, 170 135, 158 165 C 154 185, 158 225, 152 255 C 142 245, 135 210, 142 180 Z" fill="url(#hairGradFemale)" />
    
    <!-- Hair Bangs / Front Styling -->
    <path d="M 145 160 C 155 125, 185 115, 215 122 C 240 128, 252 145, 255 165 C 245 142, 225 132, 202 132 C 172 132, 155 145, 145 160 Z" fill="url(#hairGradFemale)" />

    <!-- Eyebrows (Softly arched) -->
    <path d="M 168 162 Q 180 156 191 161" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 209 161 Q 220 156 232 162" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Friendly lash accent) -->
    <path d="M 172 175 Q 180 180 188 175" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 212 175 Q 220 180 228 175" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 188 173 L 191 171" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <path d="M 228 173 L 231 171" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 200 178 L 198 192 Q 200 195 203 193" stroke="#D97706" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Gentle Smile with soft rose tone -->
    <path d="M 185 207 Q 200 219 215 207" stroke="#BE123C" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Small Teacher / School Lapel Pin -->
  <circle cx="162" cy="335" r="5" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
</svg>